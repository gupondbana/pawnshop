<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip Studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>🎬 Clip Studio</h1>
    <div id="queueBar" class="queue-bar"></div>
  </header>
  <main>
    <aside>
      <h2>โปรเจกต์ใหม่</h2>
      <form id="newForm">
        <label>ประเภท
          <select name="type">
            <option value="product">ขายสินค้า</option>
            <option value="story">เล่าเรื่อง</option>
            <option value="fable">นิทาน</option>
            <option value="knowledge">ความรู้</option>
            <option value="horror">เรื่องหลอน</option>
            <option value="follower">เพิ่มผู้ติดตาม</option>
          </select>
        </label>
        <fieldset id="productFields">
          <label>ชื่อสินค้า <input name="p_name" placeholder="เช่น ครีมกันแดดหน้าใส"></label>
          <label>ราคา <input name="p_price" placeholder="เช่น 199 บาท"></label>
          <label>ปัญหาที่ลูกค้าเจอ <input name="p_pain" placeholder="เช่น หน้ามันทั้งวัน"></label>
          <label>จุดเด่น (บรรทัดละข้อ สูงสุด 3) <textarea name="p_benefits" rows="3"></textarea></label>
          <label>โปรโมชัน <input name="p_promo" placeholder="เช่น ซื้อ 1 แถม 1"></label>
          <label>ข้อความชวนซื้อ <input name="p_cta" placeholder="กดตะกร้าเลย"></label>
          <small class="muted">ใส่รูปสินค้าจริงด้านล่างด้วย เพื่อให้สินค้าในคลิปหน้าตาตรงของจริง</small>
        </fieldset>
        <label>หัวข้อ <input name="topic"></label>
        <label>รายละเอียด <textarea name="details" rows="3"></textarea></label>
        <label>ลิงก์ (บรรทัดละลิงก์) <textarea name="links" rows="2"></textarea></label>
        <label>รูปอ้างอิง <input name="images" type="file" accept="image/*" multiple></label>
        <button>สร้างโปรเจกต์</button>
      </form>
      <h2>โปรเจกต์ทั้งหมด</h2>
      <ul id="projectList"></ul>
    </aside>
    <section id="editor"><p class="muted">เลือกหรือสร้างโปรเจกต์</p></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
